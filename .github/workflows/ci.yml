name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.6", "9.8", "9.10", "9.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
      - run: cabal update
      - run: cabal build all --dry-run
      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-${{ matrix.ghc }}-
      - run: cabal build all
      - run: cabal test --test-show-details=direct

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.8"
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "test/"]'
          fail-on: suggestion
      # The same ormolu run-docker.sh uses, from its release page. The
      # run-ormolu action failed to download its binary.
      - name: ormolu 0.7.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.7.4.0 -R tweag/ormolu -p ormolu-Linux.zip
          unzip -q ormolu-Linux.zip -d "$RUNNER_TEMP/ormolu"
          chmod +x "$RUNNER_TEMP/ormolu/ormolu"
          "$RUNNER_TEMP/ormolu/ormolu" --version
          "$RUNNER_TEMP/ormolu/ormolu" --mode check $(find src test -name "*.hs")

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: latest
      - run: cabal update
      - run: cabal check
      - run: cabal sdist
      - run: cabal haddock --haddock-all
