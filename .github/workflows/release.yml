name: Release

# On a v* tag: test, then upload a package candidate to Hackage (with docs).
# Publishing the candidate waits for approval on the "release" environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: latest
      - run: cabal update
      - name: Check the tag matches the cabal version
        run: |
          version=$(grep -E '^version:' privatus-analytics.cabal | awk '{print $2}')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: cabal test --test-show-details=direct
      - run: cabal check
      - run: cabal sdist -o dist
      - run: cabal haddock --haddock-for-hackage --haddock-hyperlink-source --haddock-quickjump
      - run: cp dist-newstyle/privatus-analytics-*-docs.tar.gz dist/
      - name: Upload the candidate
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
        run: |
          cabal upload --token="$HACKAGE_TOKEN" dist/privatus-analytics-*[0-9].tar.gz
          cabal upload --token="$HACKAGE_TOKEN" --documentation dist/privatus-analytics-*-docs.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hackage
          path: dist/

  publish:
    needs: candidate
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: latest
      - uses: actions/download-artifact@v4
        with:
          name: hackage
          path: dist/
      - name: Publish on Hackage
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
        run: |
          cabal upload --publish --token="$HACKAGE_TOKEN" dist/privatus-analytics-*[0-9].tar.gz
          cabal upload --publish --token="$HACKAGE_TOKEN" --documentation dist/privatus-analytics-*-docs.tar.gz
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." dist/*.tar.gz
